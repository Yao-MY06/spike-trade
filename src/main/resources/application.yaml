server:
  port: 8081
spring:
  application:
    name: spike
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${TRADE_DB_URL:jdbc:mysql://127.0.0.1:3306/spike_trade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}"
    username: "${TRADE_DB_USERNAME:root}"
    password: "${TRADE_DB_PASSWORD}"
  redis:
    host: "${TRADE_REDIS_HOST:127.0.0.1}"
    port: "${TRADE_REDIS_PORT:6379}"
    password: "${TRADE_REDIS_PASSWORD}"
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

  rabbitmq:
    host: "${TRADE_MQ_HOST:127.0.0.1}"
    username: "${TRADE_MQ_USERNAME}"
    password: "${TRADE_MQ_PASSWORD}"
    virtual-host: "${TRADE_MQ_VHOST:/}"
    port: "${TRADE_MQ_PORT:5672}"
    listener:
      simple:
        concurrency: 10
        max-concurrency: 10
        prefetch: 1
        auto-startup: true
        default-requeue-rejected: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        max-interval: 10000ms
        multiplier: 1
mybatis-plus:
  type-aliases-package: com.spiketrade.entity # 别名扫描包
logging:
  level:
    com.spiketrade: debug

spike:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: "${TRADE_JWT_ADMIN_SECRET}"
    # 设置jwt过期时间
    admin-ttl: 21600000
    # 设置前端传递过来的令牌名称
    admin-token-name: authentication
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: "${TRADE_JWT_USER_SECRET}"
    # 设置jwt过期时间
    user-ttl: 21600000
    # 设置前端传递过来的令牌名称
    user-token-name: authentication